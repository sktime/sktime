name: test-evaluate-global-mode

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install sktime 0.40.0
        run: |
          pip install "sktime==0.40.0" pytest "pytorch-forecasting>=1.0.0" torch lightning

      - name: Run isolated pytest
        run: |
          pytest \
            sktime/forecasting/model_evaluation/tests/test_evaluate.py::test_evaluate_global_mode \
            -vv
